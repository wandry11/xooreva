<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xooreva - Connecting TikTok</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#16102e;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .box{text-align:center;padding:24px}
  .err{color:#ff8a8a;white-space:pre-wrap;text-align:left;max-width:600px}
  a{color:#ffc83c}
</style>
</head>
<body>
<div class="box" id="box">Connecting your TikTok account...</div>
<script src="config.js"></script>
<script>
(async () => {
  const box = document.getElementById('box');
  const p = new URLSearchParams(location.search);
  let saved = null;
  try { saved = sessionStorage.getItem('xo_state'); } catch (e) {}
  if (p.get('error')) {
    box.innerHTML = '<p>Authorization was cancelled.</p><p><a href="dashboard.html">Back to dashboard</a></p>';
    return;
  }
  if (!p.get('code') || (saved && p.get('state') !== saved)) {
    box.innerHTML = '<p class="err">Invalid login response.</p><p><a href="dashboard.html">Back to dashboard</a></p>';
    return;
  }
  try {
    const r = await fetch(XO_API + '/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: p.get('code') })
    });
    const d = await r.json();
    if (!d.access_token) throw new Error(JSON.stringify(d, null, 2));
    sessionStorage.setItem('xo_token', d.access_token);
    location.replace('dashboard.html');
  } catch (e) {
    box.innerHTML = '<p class="err">' + String(e.message || e).replace(/</g, '&lt;') + '</p><p><a href="dashboard.html">Back to dashboard</a></p>';
  }
})();
</script>
</body>
</html>
